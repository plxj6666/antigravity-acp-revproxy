server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name acp.example.org;
    ssl_certificate /etc/letsencrypt/live/acp.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acp.example.org/privkey.pem;
    access_log off;
    client_max_body_size 12m;
    location = /admin { return 302 /admin/; }
    location = /admin/ { rewrite ^ /admin/index.html last; }
    location = /admin/index.html {
        include /etc/nginx/snippets/agy-admin-guard.conf;
        alias /opt/acp-gateway/deploy/admin.html;
        default_type text/html;
    }
    location = /admin/ui.js {
        include /etc/nginx/snippets/agy-admin-guard.conf;
        alias /opt/acp-gateway/deploy/ui.js;
    }
    location = /admin/accounts {
        include /etc/nginx/snippets/agy-admin-guard.conf;
        client_max_body_size 1k;
        proxy_set_header Authorization "";
        proxy_pass http://unix:/run/acp-gateway-sockets/registry.sock:/accounts;
    }
    location ~ ^/admin/(?<account>lab[1-9][0-9]?)/(?<operation>start|finish|import|quota|status)$ {
        include /etc/nginx/snippets/agy-admin-guard.conf;
        client_max_body_size 40k;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Authorization "";
        proxy_pass http://unix:/run/acp-gateway-sockets/admin-$account.sock:/$operation;
        proxy_read_timeout 90s;
    }
    location /admin/ { return 404; }
    location / {
        proxy_pass http://unix:/run/acp-gateway-sockets/router.sock;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
        proxy_read_timeout 1150s;
    }
}
