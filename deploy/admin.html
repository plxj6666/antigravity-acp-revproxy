<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账号管理 · Antigravity</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8fb;color:#192e43;font:16px/1.6 system-ui,sans-serif}header{background:#173653;color:white;padding:16px max(5vw,calc((100vw - 850px)/2));font-weight:650;white-space:nowrap}main{max-width:890px;margin:7vh auto;padding:0 20px}h1{font-size:clamp(30px,5vw,44px);margin-bottom:4px}p,small{color:#4c6275}section{background:white;border:1px solid #d1dde5;border-radius:12px;padding:clamp(18px,4vw,34px);margin:24px 0}label{display:block;margin:16px 0 6px;font-weight:600}button,select,input,textarea,a.action{font:inherit;border:1px solid #a2b3c2;border-radius:6px;padding:8px 14px;background:white;color:inherit}button,a.action{cursor:pointer}button.primary,a.action{background:#145987;color:white;border-color:#145987;text-decoration:none;display:inline-block}button:disabled{opacity:.55;cursor:wait}input,textarea{width:100%;margin:4px 0 12px}select{margin-right:12px}.tabs{display:flex;gap:8px;margin:26px 0 16px}.tabs [aria-pressed=true]{border:2px solid #145987;color:#145987;font-weight:650}#msg{min-height:1.6em;white-space:pre-wrap;font-weight:600}[hidden]{display:none!important}:focus-visible{outline:3px solid #2989bb;outline-offset:3px}main{max-width:1160px;margin:42px auto}header{padding:16px max(5vw,calc((100vw - 1120px)/2))}.toolbar,.rowhead,.meterline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.toolbar{justify-content:space-between}.toolbar h1{margin:0}.toolbar p{margin:2px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:16px;margin:20px 0 36px}.card{background:#fff;border:1px solid #c6d8e2;border-top:3px solid #508198;padding:18px;border-radius:9px;min-width:0}.rowhead,.meterline{justify-content:space-between}.card h3{margin:0;font-size:19px;overflow-wrap:anywhere}.card small{display:block}.meterline{margin-top:14px}.meterline span{font-size:14px;overflow-wrap:anywhere}progress{width:100%;height:8px;accent-color:#247a76}.card summary{margin-top:12px;cursor:pointer}.badge{color:#375c66;background:#e9f3f4;padding:3px 8px;border-radius:4px;font-size:13px}#notice{min-height:1.6em}#enroll h2{margin-top:0}</style><header>Antigravity / 网关运维</header><main><div class="toolbar"><div><h1>账号用量</h1><p>按账号查看 Google 返回的剩余额度与重置时间。</p></div><div><button id="refresh">刷新用量</button> <button class="primary" id="add">＋ 新增账号</button></div></div><small id="notice" role="status"></small><div id="grid" class="grid" aria-label="账号列表"></div><section id="enroll"><h2>绑定账号</h2><label for="slot">账号槽位</label><select id="slot" aria-label="选择绑定槽位"></select><small id="state" aria-live="polite"></small><div class="tabs"><button id="oauth" aria-pressed="true">Google OAuth</button><button id="token" aria-pressed="false">Token 导入</button></div><div id="authpane"><p>先生成授权链接，在 Google 完成登录后，将授权码或最终回调地址粘贴回来。</p><button class="primary" id="start">生成授权链接</button><div id="flow" hidden><p><a class="action" id="link" target="_blank" rel="noopener noreferrer">前往 Google 授权 ↗</a> <button type="button" id="copyLink">复制授权链接</button></p><input hidden readonly id="manualLink" aria-label="手动复制授权链接" autocomplete="off"><label for="code">授权码或回调地址</label><input id="code" type="password" autocomplete="off"><button class="primary" id="finish">验证并绑定</button></div></div><div id="tokenpane" hidden><label for="secret">Antigravity 凭据</label><p>粘贴个人账号的 refresh token（1// 开头）或 CLI 凭据 JSON。不接受网关密钥或 Gemini API key。</p><input id="secret" type="password" autocomplete="off" spellcheck="false"><button id="imp" class="primary">验证并导入</button></div><div id="msg" role="status"></div></section><small>验证成功才替换该槽位的凭据。账号池每 5 分钟检查一次可用性。</small></main><script src="/admin/ui.js"></script></html>
