auth_basic "Antigravity admin";
auth_basic_user_file /etc/nginx/agy-admin.htpasswd;
add_header Cache-Control "no-store" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options nosniff always;
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
